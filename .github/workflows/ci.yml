name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm run test:unit

      - name: Typecheck and build
        run: pnpm run build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: UI tests
        run: pnpm run test:ui

      - name: Check icons.json is in sync with @tabler/icons
        run: |
          node import-icons.js
          git diff --exit-code src/icons.json || {
            echo "::error::src/icons.json is out of date. Run 'node import-icons.js' and commit the result."
            exit 1
          }
